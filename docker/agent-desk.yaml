server:
  port: 8083
  trustedProxies: []
  cors:
    # 浏览器跨域白名单。生产部署时改为实际前端/嵌入站点域名。
    allowedOrigins:
      - http://127.0.0.1:8083
      - http://localhost:8083

db:
  type: mysql
  # 生产 DSN 只能通过 AGENT_DESK_DB_DSN 注入。
  dsn: ""
  maxIdleConns: 5
  maxOpenConns: 20
  connMaxIdleTimeSeconds: 300
  connMaxLifetimeSeconds: 1800

logger:
  level: info
  format: text
  addSource: false

auth:
  tokenTTLHours: 12
  maxFailedAttempts: 5
  credentialLockMinute: 15

tenantRegistration:
  enabled: false

backgroundWorkers:
  enabled: true

email:
  enabled: false
  host: ""
  port: 587
  username: ""
  from: ""
  fromName: "Agent Desk"
  tlsMode: starttls
  publicUrl: ""

fastGPT:
  enabled: false
  baseUrl: ""
  timeoutMs: 15000
  maxRetries: 1
  retrievalTokenLimit: 400

customerSession:
  ttlMinutes: 120
  refreshThresholdMinutes: 30

storage:
  default: local
  maxUploadSizeMB: 20
  assetURLTTLSeconds: 3600
  local:
    root: /app/data/storage
    baseUrl: /storage
  oss:
    endpoint: ""
    bucket: ""
    baseUrl: ""
    private: false
    signedUrlExpireSeconds: 600

mcp:
  enabled: true
  servers:
    system:
      enabled: true
      endpoint: "http://127.0.0.1:8083/api/mcp"
      timeoutMs: 15000
      headers: {}

oidc:
  enabled: false
  issuer: ""
  clientId: ""
  redirectUrl: "http://127.0.0.1:8083/api/auth/oidc_callback"
  scopes:
    - openid
    - profile
    - email

wxWork:
  enabled: false
  corpId: ""
  agentId: ""
  oauthRedirect: ""
  notify:
    enabled: false
    toUsers: []
    safe: false
    enableDuplicateCheck: true
    duplicateCheckInterval: 1800

arrival:
  enabled: false
  publicBaseUrl: ""
  miniProgramAppId: ""
  weComSuiteId: ""
  weChatApiBaseUrl: "https://api.weixin.qq.com"
  weComApiBaseUrl: "https://qyapi.weixin.qq.com"
  qrCodeAllowedHostSuffixes:
    - wework.qpic.cn
    - wwcdn.weixin.qq.com
    - work.weixin.qq.com
  sessionTtlMinutes: 30
  invitationTtlMinutes: 1440
  contactWayTtlMinutes: 1440
  deliveryRateLimitSeconds: 60
