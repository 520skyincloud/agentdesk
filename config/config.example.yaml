server:
  port: 8083
  # 仅填写实际反向代理的 IP 或 CIDR。留空时忽略 X-Forwarded-For/X-Real-IP，
  # 防止公开登录、邮箱验证码和邀请注册的 IP 限流被伪造请求头绕过。
  trustedProxies: []
  cors:
    # 浏览器跨域白名单。生产环境必须改为实际前端/嵌入站点域名，例如 https://support.example.com。
    # 留空表示不允许跨域请求，只支持同源或非浏览器调用。
    allowedOrigins:
      - http://127.0.0.1:8083
      - http://localhost:8083

db:
  type: sqlite
  # MySQL 生产 DSN 通过 AGENT_DESK_DB_DSN 注入；SQLite 本地开发可保留此路径。
  dsn: file:./data/app.db?_busy_timeout=5000
  maxIdleConns: 5
  maxOpenConns: 20
  connMaxIdleTimeSeconds: 300
  connMaxLifetimeSeconds: 1800

logger:
  level: info
  format: text
  addSource: false

auth:
  tokenTTLHours: 12
  maxFailedAttempts: 5
  credentialLockMinute: 15
  # 公司邀请码密钥只能通过 AGENT_DESK_INVITATION_ENCRYPTION_KEY 注入。

tenantRegistration:
  # 多租户业务数据与非 HTTP 链路完成隔离验收前必须保持关闭。
  # 生产环境也可通过 AGENT_DESK_TENANT_REGISTRATION_ENABLED 覆盖。
  enabled: false

backgroundWorkers:
  # 正常服务保持开启；历史库迁移、恢复演练和只读预检实例必须显式关闭。
  # 可通过 AGENT_DESK_BACKGROUND_WORKERS_ENABLED 覆盖。
  enabled: true

email:
  # 邮箱验证码登录必须使用真实 SMTP；未配置时相关入口会明确不可用。
  enabled: false
  host: ""
  port: 587
  username: ""
  # SMTP 密码只能通过 AGENT_DESK_EMAIL_PASSWORD 注入。
  from: ""
  fromName: "Agent Desk"
  # 可选：starttls / tls / plain。生产环境建议 starttls 或 tls。
  tlsMode: starttls
  publicUrl: ""

fastGPT:
  # 平台统一托管的 FastGPT OpenAPI 连接。
  # 集成令牌只允许通过 AGENT_DESK_FASTGPT_INTEGRATION_TOKEN 注入。
  enabled: false
  baseUrl: ""
  # 生产默认只允许 HTTPS；仅明确批准直连 HTTP 集成端点时启用。
  allowInsecureHttp: false
  timeoutMs: 15000
  maxRetries: 1
  # FastGPT 检索引擎的最大参考 token。默认 400，避免过量召回抬高回复模型成本。
  retrievalTokenLimit: 400

customerSession:
  # 签名密钥只能通过 AGENT_DESK_CUSTOMER_SESSION_SECRET 注入。
  # 客服会话 token 默认有效期，单位分钟。
  ttlMinutes: 120
  # token 剩余有效期小于该值时自动续期，单位分钟。
  refreshThresholdMinutes: 30

storage:
  default: local
  maxUploadSizeMB: 20
  # 文件下载签名密钥只能通过 AGENT_DESK_ASSET_URL_SIGNING_SECRET 注入。
  # 应用层签名下载地址有效期，默认 3600 秒。
  assetURLTTLSeconds: 3600
  local:
    root: data/storage
    baseUrl: /storage
  oss:
    endpoint: ""
    bucket: ""
    # AccessKey 只能通过 AGENT_DESK_OSS_ACCESS_KEY_ID / AGENT_DESK_OSS_ACCESS_KEY_SECRET 注入。
    baseUrl: ""
    private: false
    signedUrlExpireSeconds: 600

mcp:
  enabled: true
  servers:
    system:
      enabled: true
      endpoint: "http://127.0.0.1:8083/api/mcp"
      timeoutMs: 15000
      headers: {}

oidc:
  # 是否启用 OIDC 登录；本系统作为 OIDC Client。
  enabled: false
  # OIDC Provider issuer，例如 https://idp.example.com/realms/demo。
  issuer: ""
  clientId: ""
  # Client Secret 只能通过 AGENT_DESK_OIDC_CLIENT_SECRET 注入。
  # 必须与 OIDC Provider 后台登记的 redirect_uri 完全一致。
  redirectUrl: "http://127.0.0.1:8083/api/auth/oidc_callback"
  # State 密钥只能通过 AGENT_DESK_OIDC_STATE_SECRET 注入。
  scopes:
    - openid
    - profile
    - email

wxWork:
  # 是否启用企业微信能力。
  # false 时不会初始化企业微信 SDK，登录、客服回调、应用通知都不可用。
  enabled: false
  # 企业微信公司 ID。
  # 例如：wwxxxxxxxxxxxxxxxx，来自企业微信管理后台。
  corpId: 
  # 应用 Secret 只能通过 AGENT_DESK_WXWORK_CORP_SECRET 注入。
  # 企业微信自建应用 AgentID。
  # 网页授权 scope=snsapi_privateinfo 时会使用该字段。
  agentId: 
  # 企业微信网页授权回调地址。
  # 必须是完整 URL，且应指向后端接口：
  # 例如：http://127.0.0.1:8083/api/auth/wxwork_callback
  # 线上环境应填写可被企业微信访问的正式域名，并确保域名已在企业微信后台配置。
  oauthRedirect: ""
  # State、RSA 私钥、回调 Token 与 EncodingAESKey 分别通过对应 AGENT_DESK_WXWORK_* 环境变量注入。

  notify:
    # 是否启用企业微信应用消息通知。
    enabled: false
    # 默认接收通知的系统用户ID列表；如业务目标用户已绑定企业微信身份，会优先发给目标用户。
    # 系统用户ID会通过企业微信身份绑定映射为企业微信成员ID后发送。
    toUsers: []
    # 是否发送保密消息。
    safe: false
    # 是否开启重复消息检查。
    enableDuplicateCheck: true
    # 重复消息检查时间窗口，单位秒。
    duplicateCheckInterval: 1800

arrival:
  # 到店联动只能在正式 HTTPS 域名、服务商回调和小程序域名均配置后启用。
  enabled: false
  publicBaseUrl: ""
  miniProgramAppId: ""
  weComSuiteId: ""
  weChatApiBaseUrl: "https://api.weixin.qq.com"
  weComApiBaseUrl: "https://qyapi.weixin.qq.com"
  qrCodeAllowedHostSuffixes:
    - wework.qpic.cn
    - wwcdn.weixin.qq.com
    - work.weixin.qq.com
  sessionTtlMinutes: 30
  invitationTtlMinutes: 1440
  contactWayTtlMinutes: 1440
  deliveryRateLimitSeconds: 60
