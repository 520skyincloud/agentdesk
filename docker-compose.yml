services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${AGENT_DESK_MYSQL_DATABASE:-cs_ai_agent}
      MYSQL_USER: ${AGENT_DESK_MYSQL_USER:-cs_ai_agent}
      MYSQL_PASSWORD: ${AGENT_DESK_MYSQL_PASSWORD:?Set AGENT_DESK_MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${AGENT_DESK_MYSQL_ROOT_PASSWORD:?Set AGENT_DESK_MYSQL_ROOT_PASSWORD in .env}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  agent-desk:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOPROXY: ${AGENT_DESK_BUILD_GOPROXY:-https://goproxy.cn,direct}
    image: mlogclub/agent-desk:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8083:8083"
    volumes:
      - agent-desk-data:/app/data
      - ./docker/agent-desk.yaml:/app/config/config.yaml:ro
    environment:
      TZ: Asia/Shanghai
      APP_ENV: production
      AGENT_DESK_ENV: production
      AGENT_DESK_BACKGROUND_WORKERS_ENABLED: ${AGENT_DESK_BACKGROUND_WORKERS_ENABLED:-true}
      NO_PROXY: localhost,127.0.0.1,host.docker.internal,mysql
      AGENT_DESK_DB_DSN: ${AGENT_DESK_DB_DSN:?Set AGENT_DESK_DB_DSN in .env}
      AGENT_DESK_BOOTSTRAP_ADMIN_USERNAME: ${AGENT_DESK_BOOTSTRAP_ADMIN_USERNAME:-}
      AGENT_DESK_BOOTSTRAP_ADMIN_PASSWORD: ${AGENT_DESK_BOOTSTRAP_ADMIN_PASSWORD:-}
      AGENT_DESK_INVITATION_ENCRYPTION_KEY: ${AGENT_DESK_INVITATION_ENCRYPTION_KEY:?Set AGENT_DESK_INVITATION_ENCRYPTION_KEY in .env}
      AGENT_DESK_CUSTOMER_SESSION_SECRET: ${AGENT_DESK_CUSTOMER_SESSION_SECRET:?Set AGENT_DESK_CUSTOMER_SESSION_SECRET in .env}
      AGENT_DESK_ASSET_URL_SIGNING_SECRET: ${AGENT_DESK_ASSET_URL_SIGNING_SECRET:?Set AGENT_DESK_ASSET_URL_SIGNING_SECRET in .env}
      AGENT_DESK_STORE_MODEL_CREDENTIAL_MASTER_KEY: ${AGENT_DESK_STORE_MODEL_CREDENTIAL_MASTER_KEY:?Set AGENT_DESK_STORE_MODEL_CREDENTIAL_MASTER_KEY in .env}
      AGENT_DESK_STORE_MODEL_CREDENTIAL_MASTER_KEY_ID: ${AGENT_DESK_STORE_MODEL_CREDENTIAL_MASTER_KEY_ID:?Set AGENT_DESK_STORE_MODEL_CREDENTIAL_MASTER_KEY_ID in .env}
      AGENT_DESK_FASTGPT_ENABLED: ${AGENT_DESK_FASTGPT_ENABLED:-}
      AGENT_DESK_FASTGPT_BASE_URL: ${AGENT_DESK_FASTGPT_BASE_URL:-}
      AGENT_DESK_FASTGPT_INTEGRATION_TOKEN: ${AGENT_DESK_FASTGPT_INTEGRATION_TOKEN:-}
      AGENT_DESK_FASTGPT_RETRIEVAL_TOKEN_LIMIT: ${AGENT_DESK_FASTGPT_RETRIEVAL_TOKEN_LIMIT:-}
      AGENT_DESK_EMAIL_ENABLED: ${AGENT_DESK_EMAIL_ENABLED:-}
      AGENT_DESK_EMAIL_HOST: ${AGENT_DESK_EMAIL_HOST:-}
      AGENT_DESK_EMAIL_USERNAME: ${AGENT_DESK_EMAIL_USERNAME:-}
      AGENT_DESK_EMAIL_PASSWORD: ${AGENT_DESK_EMAIL_PASSWORD:-}
      AGENT_DESK_EMAIL_FROM: ${AGENT_DESK_EMAIL_FROM:-}
      AGENT_DESK_EMAIL_PUBLIC_URL: ${AGENT_DESK_EMAIL_PUBLIC_URL:-}
      AGENT_DESK_OIDC_ENABLED: ${AGENT_DESK_OIDC_ENABLED:-}
      AGENT_DESK_OIDC_ISSUER: ${AGENT_DESK_OIDC_ISSUER:-}
      AGENT_DESK_OIDC_CLIENT_ID: ${AGENT_DESK_OIDC_CLIENT_ID:-}
      AGENT_DESK_OIDC_CLIENT_SECRET: ${AGENT_DESK_OIDC_CLIENT_SECRET:-}
      AGENT_DESK_OIDC_REDIRECT_URL: ${AGENT_DESK_OIDC_REDIRECT_URL:-}
      AGENT_DESK_OIDC_STATE_SECRET: ${AGENT_DESK_OIDC_STATE_SECRET:-}
      AGENT_DESK_OSS_ACCESS_KEY_ID: ${AGENT_DESK_OSS_ACCESS_KEY_ID:-}
      AGENT_DESK_OSS_ACCESS_KEY_SECRET: ${AGENT_DESK_OSS_ACCESS_KEY_SECRET:-}
      AGENT_DESK_WXWORK_ENABLED: ${AGENT_DESK_WXWORK_ENABLED:-}
      AGENT_DESK_WXWORK_CORP_ID: ${AGENT_DESK_WXWORK_CORP_ID:-}
      AGENT_DESK_WXWORK_CORP_SECRET: ${AGENT_DESK_WXWORK_CORP_SECRET:-}
      AGENT_DESK_WXWORK_AGENT_ID: ${AGENT_DESK_WXWORK_AGENT_ID:-}
      AGENT_DESK_WXWORK_OAUTH_REDIRECT: ${AGENT_DESK_WXWORK_OAUTH_REDIRECT:-}
      AGENT_DESK_WXWORK_STATE_SECRET: ${AGENT_DESK_WXWORK_STATE_SECRET:-}
      AGENT_DESK_WXWORK_RSA_PRIVATE_KEY: ${AGENT_DESK_WXWORK_RSA_PRIVATE_KEY:-}
      AGENT_DESK_WXWORK_TOKEN: ${AGENT_DESK_WXWORK_TOKEN:-}
      AGENT_DESK_WXWORK_ENCODING_AES_KEY: ${AGENT_DESK_WXWORK_ENCODING_AES_KEY:-}
      AGENT_DESK_ARRIVAL_ENABLED: ${AGENT_DESK_ARRIVAL_ENABLED:-false}
      AGENT_DESK_ARRIVAL_PUBLIC_BASE_URL: ${AGENT_DESK_ARRIVAL_PUBLIC_BASE_URL:-}
      AGENT_DESK_MINIPROGRAM_APP_ID: ${AGENT_DESK_MINIPROGRAM_APP_ID:-}
      AGENT_DESK_MINIPROGRAM_APP_SECRET: ${AGENT_DESK_MINIPROGRAM_APP_SECRET:-}
      AGENT_DESK_ARRIVAL_SESSION_SECRET: ${AGENT_DESK_ARRIVAL_SESSION_SECRET:-}
      AGENT_DESK_ARRIVAL_IDENTITY_HMAC_KEY: ${AGENT_DESK_ARRIVAL_IDENTITY_HMAC_KEY:-}
      AGENT_DESK_ARRIVAL_DATA_MASTER_KEY: ${AGENT_DESK_ARRIVAL_DATA_MASTER_KEY:-}
      AGENT_DESK_ARRIVAL_DATA_MASTER_KEY_ID: ${AGENT_DESK_ARRIVAL_DATA_MASTER_KEY_ID:-}
      AGENT_DESK_WECOM_SUITE_ID: ${AGENT_DESK_WECOM_SUITE_ID:-}
      AGENT_DESK_WECOM_SUITE_SECRET: ${AGENT_DESK_WECOM_SUITE_SECRET:-}
      AGENT_DESK_WECOM_PROVIDER_CALLBACK_TOKEN: ${AGENT_DESK_WECOM_PROVIDER_CALLBACK_TOKEN:-}
      AGENT_DESK_WECOM_PROVIDER_ENCODING_AES_KEY: ${AGENT_DESK_WECOM_PROVIDER_ENCODING_AES_KEY:-}
      AGENT_DESK_WECOM_AUTH_TYPE: ${AGENT_DESK_WECOM_AUTH_TYPE:-1}
      AGENT_DESK_ARRIVAL_CONTACT_PROVIDER: ${AGENT_DESK_ARRIVAL_CONTACT_PROVIDER:-contact_way}
      AGENT_DESK_ARRIVAL_WECHAT_API_BASE_URL: ${AGENT_DESK_ARRIVAL_WECHAT_API_BASE_URL:-}
      AGENT_DESK_ARRIVAL_WECOM_API_BASE_URL: ${AGENT_DESK_ARRIVAL_WECOM_API_BASE_URL:-}
      AGENT_DESK_ARRIVAL_QR_ALLOWED_HOST_SUFFIXES: ${AGENT_DESK_ARRIVAL_QR_ALLOWED_HOST_SUFFIXES:-}
      AGENT_DESK_ARRIVAL_SESSION_TTL_MINUTES: ${AGENT_DESK_ARRIVAL_SESSION_TTL_MINUTES:-}
      AGENT_DESK_ARRIVAL_INVITATION_TTL_MINUTES: ${AGENT_DESK_ARRIVAL_INVITATION_TTL_MINUTES:-}
      AGENT_DESK_ARRIVAL_CONTACT_WAY_TTL_MINUTES: ${AGENT_DESK_ARRIVAL_CONTACT_WAY_TTL_MINUTES:-}
      AGENT_DESK_ARRIVAL_DELIVERY_RATE_LIMIT_SECONDS: ${AGENT_DESK_ARRIVAL_DELIVERY_RATE_LIMIT_SECONDS:-}
      AGENT_DESK_ARRIVAL_BIND_TICKET_TTL_MINUTES: ${AGENT_DESK_ARRIVAL_BIND_TICKET_TTL_MINUTES:-}
      AGENT_DESK_ARRIVAL_BIND_PENDING_SCAN_WINDOW_MINUTES: ${AGENT_DESK_ARRIVAL_BIND_PENDING_SCAN_WINDOW_MINUTES:-}

volumes:
  mysql-data:
  agent-desk-data:
