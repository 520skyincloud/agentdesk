services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cs_ai_agent
      MYSQL_USER: cs_ai_agent
      MYSQL_PASSWORD: cs_ai_agent_password
      MYSQL_ROOT_PASSWORD: cs_ai_agent_root_password
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"

  agent-desk:
    build:
      context: .
      dockerfile: Dockerfile
    image: mlogclub/agent-desk:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "8083:8083"
    volumes:
      - agent-desk-data:/app/data
      - ./docker/agent-desk.yaml:/app/config/config.yaml:ro
    environment:
      TZ: Asia/Shanghai
      NO_PROXY: localhost,127.0.0.1,host.docker.internal,mysql,qdrant
      AGENT_DESK_FASTGPT_ENABLED: ${AGENT_DESK_FASTGPT_ENABLED:-}
      AGENT_DESK_FASTGPT_BASE_URL: ${AGENT_DESK_FASTGPT_BASE_URL:-}
      AGENT_DESK_FASTGPT_API_KEY: ${AGENT_DESK_FASTGPT_API_KEY:-}
      AGENT_DESK_FASTGPT_RETRIEVAL_TOKEN_LIMIT: ${AGENT_DESK_FASTGPT_RETRIEVAL_TOKEN_LIMIT:-}
      AGENT_DESK_NEW_API_USAGE_ENABLED: ${AGENT_DESK_NEW_API_USAGE_ENABLED:-false}
      AGENT_DESK_NEW_API_USAGE_BASE_URL: ${AGENT_DESK_NEW_API_USAGE_BASE_URL:-}
      AGENT_DESK_NEW_API_USAGE_ACCESS_TOKEN: ${AGENT_DESK_NEW_API_USAGE_ACCESS_TOKEN:-}
      AGENT_DESK_NEW_API_USAGE_USER_ID: ${AGENT_DESK_NEW_API_USAGE_USER_ID:-}
      AGENT_DESK_NEW_API_USAGE_FASTGPT_TOKEN_NAME: ${AGENT_DESK_NEW_API_USAGE_FASTGPT_TOKEN_NAME:-}

volumes:
  mysql-data:
  qdrant-data:
  agent-desk-data:
